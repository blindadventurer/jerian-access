name: Something is silent or spoken wrong
description: A screen that says nothing, says the wrong thing, or cannot be reached from the keyboard.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Silence counts as a bug here: a screen that says nothing
        is indistinguishable, to a blind player, from a screen that has stopped responding.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Which screen or scene you were on, what you pressed, and what you heard - or where it went quiet.
      placeholder: |
        On the chapter 3 project page, Down arrow moved through the projects but the third one
        read only "button, 3 of 9" with no name.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Mod version
      description: The version in the zip file name, or the "Loading [Jerian Access ...]" line at the top of the log.
      placeholder: "0.9.2"
    validations:
      required: true
  - type: input
    id: screen-reader
    attributes:
      label: Screen reader
      description: NVDA, JAWS, or the SAPI fallback - and its version if you know it.
      placeholder: "NVDA 2025.1"
    validations:
      required: false
  - type: input
    id: language
    attributes:
      label: Game language
      placeholder: "Russian"
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Attach `BepInEx\LogOutput.log` from the game folder. Quit the game before you collect it -
        it is written up to the moment you leave, and it is overwritten the next time the game
        starts. If the game crashed or froze, attach Player.log from
        `%USERPROFILE%\AppData\LocalLow\Schisma\The Life and Suffering of Prince Jerian` as well.
        You can drag the files into this box.
    validations:
      required: false
